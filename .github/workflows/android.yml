name: CI (Android)
run-name: "CI (Android) ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

# Only trigger workflow when Android-specific code could have changed.
# This includes C/C++ files that have __ANDROID__ ifdefs.
# If adding new ifdefs, make sure to update these lists.
on:
  push:
    paths:
      - "desktop_version/CMakeLists.txt"
      - "desktop_version/src/ButtonGlyphs.cpp"
      - "desktop_version/src/FileSystemUtils.cpp"
      - "desktop_version/src/Screen.cpp"
      - "desktop_version/src/Vlogging.c"
      - "desktop_version/VVVVVV-android/gradlew"
      - "desktop_version/VVVVVV-android/gradlew.bat"
      - "desktop_version/VVVVVV-android/**/CMakeLists.txt"
      - "desktop_version/VVVVVV-android/**.java"
      - "desktop_version/VVVVVV-android/**.xml"
      - "desktop_version/VVVVVV-android/**.pro"
      - "desktop_version/VVVVVV-android/**.mk"
      - "desktop_version/VVVVVV-android/**.gradle"
      - "desktop_version/VVVVVV-android/**.jar"
      - "desktop_version/VVVVVV-android/**.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "desktop_version/CMakeLists.txt"
      - "desktop_version/src/ButtonGlyphs.cpp"
      - "desktop_version/src/FileSystemUtils.cpp"
      - "desktop_version/src/Screen.cpp"
      - "desktop_version/src/Vlogging.c"
      - "desktop_version/VVVVVV-android/gradlew"
      - "desktop_version/VVVVVV-android/gradlew.bat"
      - "desktop_version/VVVVVV-android/**/CMakeLists.txt"
      - "desktop_version/VVVVVV-android/**.java"
      - "desktop_version/VVVVVV-android/**.xml"
      - "desktop_version/VVVVVV-android/**.pro"
      - "desktop_version/VVVVVV-android/**.mk"
      - "desktop_version/VVVVVV-android/**.gradle"
      - "desktop_version/VVVVVV-android/**.jar"
      - "desktop_version/VVVVVV-android/**.properties"
      - ".github/workflows/android.yml"

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  SRC_DIR_PATH: VVVVVV/desktop_version/VVVVVV-android

jobs:
  build:
    name: Build (Android)

    runs-on: ubuntu-latest

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        submodules: true
        path: 'VVVVVV'
    - name: Assert instrumentation is live
      continue-on-error: true
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        repository: libsdl-org/SDL
        ref: release-2.30.8
        path: 'SDL'
    - name: Assert instrumentation is live
      continue-on-error: true
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
    - name: Build SDL
      run: |
        sudo apt-get -y install ninja-build
        cd SDL
        ./build-scripts/android-prefab.sh
        mvn install:install-file -Dfile=build-android-prefab/prefab-2.30.8/SDL2-2.30.8.aar -DpomFile=build-android-prefab/prefab-2.30.8/SDL2-2.30.8.pom

    - name: Build
      run: |
        cd ${SRC_DIR_PATH}
        ./gradlew build
